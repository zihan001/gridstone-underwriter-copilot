<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comp Memo Viewer — Gridstone</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   Comp Memo Viewer — dark terminal / audit-grade
   IBM Plex Sans + IBM Plex Mono · violet accent · ochre warn
   ========================================================================== */
:root {
  /* ==== KV Capital brand palette — light, audit-grade ==== */
  --surface:   #FFFFFF;
  --bg:        #FFFFFF;   /* main content surface */
  --bg-rail:   #F4F7F2;   /* pale lime-white wash · secondary fills */
  --panel:     #FFFFFF;   /* card / panel surface */
  --panel-2:   #F4F7F2;   /* subtle wash · table heads */
  --panel-3:   #ECF1E8;   /* tertiary wash · tracks */
  --line:      #E2E8E2;   /* hairline */
  --line-2:    #D2DCD2;
  --line-3:    #C2CEC2;
  --line-strong:#AEBCAE;

  --tx-dim:    #5A645E;

  --ink:       #16201C;   /* dark green-black · primary headings */
  --ink-2:     #2C3A33;   /* body text */
  --ink-3:     #3F4C45;
  --muted:     #5A645E;   /* secondary / muted text */
  --faint:     #7C867F;   /* faint labels */

  /* teal — primary brand */
  --teal:      #1B7A8C;
  --accent-rgb: 27,122,140;
  --accent:    #1B7A8C;
  --accent-2:  #156374;   /* darker teal for legible text on white */
  --accent-dim:#125564;
  --accent-bg: rgba(var(--accent-rgb),0.08);
  --accent-bd: rgba(var(--accent-rgb),0.28);

  /* lime — energetic accent */
  --lime:      #9DC020;
  --lime-text: #6F8F1A;   /* darkened lime for text contrast */

  /* warn — amber */
  --warn-rgb:  200,130,28;
  --warn:      #C8821C;
  --warn-2:    #9A6411;   /* darker amber for text */
  --warn-bg:   rgba(var(--warn-rgb),0.10);
  --warn-bd:   rgba(var(--warn-rgb),0.32);

  /* good / supported — lime */
  --good-rgb:  111,143,26;
  --good:      #6F8F1A;
  --good-bg:   rgba(var(--good-rgb),0.10);
  --good-bd:   rgba(var(--good-rgb),0.32);

  /* hard flag — red */
  --bad-rgb:   180,35,42;
  --bad:       #B4232A;
  --bad-bg:    rgba(var(--bad-rgb),0.07);
  --bad-bd:    rgba(var(--bad-rgb),0.28);

  --neg:       oklch(0.50 0.046 215);   /* superior → negative adj · muted teal-blue */
  --pos:       oklch(0.52 0.050 64);    /* inferior → positive adj · muted ochre */

  --r:  6px;
  --r2: 9px;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

/* ============================================================================
   NAV RAIL — dark green-black panel. Relight the token ramp within scope so
   the rail's children stay legible against the dark surface.
   ========================================================================== */
.rail {
  --bg-rail:   #16201C;
  --ink:       #EEF3EC;
  --ink-2:     #C3CEC5;
  --ink-3:     #AAB6AC;
  --muted:     #97A39A;
  --faint:     #7C887F;
  --tx-dim:    #97A39A;
  --panel:     rgba(255,255,255,0.045);
  --panel-2:   rgba(255,255,255,0.07);
  --line:      rgba(255,255,255,0.09);
  --line-2:    rgba(255,255,255,0.16);
  --accent-2:  #6FC6D6;   /* lighter teal for text on dark */
  --accent-bg: rgba(157,192,32,0.16);   /* lime-tinted active state */
  --accent-bd: rgba(157,192,32,0.42);
  --good:      #B9D85E;   /* lighter lime for REAL tag */
  --good-bg:   rgba(157,192,32,0.14);
  --good-bd:   rgba(157,192,32,0.40);
  --warn-2:    #E2A24A;
  --warn-bg:   rgba(200,130,28,0.16);
  --warn-bd:   rgba(200,130,28,0.42);
}
.rail .brand-dot { background: var(--lime); box-shadow: 0 0 0 3px rgba(157,192,32,0.18); }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.mono { font-family: var(--mono); font-feature-settings: "tnum" 1, "zero" 1; }
::selection { background: var(--accent-bg); }

/* scrollbars */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: #CDD6CD; border-radius: 6px; border: 2px solid var(--bg); }
*::-webkit-scrollbar-thumb:hover { background: #B6C2B6; }

/* ---- app layout ---------------------------------------------------------- */
#app { height: 100vh; display: grid; grid-template-columns: 268px 1fr; }

/* ---- nav rail ------------------------------------------------------------ */
.rail {
  background: var(--bg-rail);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  min-height: 0;
}
.rail-brand {
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--line);
}
.brand-mark {
  display: flex; align-items: center; gap: 9px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
  color: var(--tx-dim); text-transform: uppercase;
}
.brand-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-bg); }
.brand-title { margin: 11px 0 2px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
.brand-sub { font-family: var(--mono); font-size: 11px; color: var(--faint); }

.case-switch { display: flex; align-items: center; gap: 8px; margin-top: 11px; }
.case-switch-k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--faint); }
.case-switch select {
  flex: 1; min-width: 0; font-family: var(--mono); font-size: 11px; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r);
  padding: 5px 8px; cursor: pointer;
}
.case-switch select:focus { outline: none; border-color: var(--accent-bd); }

.rail-subject {
  margin: 14px 14px 6px; padding: 11px 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
}
.rs-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rs-addr { font-size: 12px; font-weight: 600; color: var(--ink); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rs-meta { margin-top: 7px; font-family: var(--mono); font-size: 10.5px; color: var(--muted);
  display: flex; flex-wrap: wrap; gap: 4px 10px; line-height: 1.5; }

.rail-nav { padding: 8px 10px; overflow-y: auto; flex: 1; min-height: 0; }
.nav-group-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--faint); padding: 12px 8px 7px;
}
.nav-item {
  display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 9px;
  width: 100%; text-align: left; cursor: pointer;
  background: transparent; border: 1px solid transparent; border-radius: var(--r);
  padding: 8px 9px; margin-bottom: 2px; color: var(--ink-2);
  font-family: inherit; font-size: 13px; transition: background .12s, color .12s, border-color .12s;
}
.nav-item:hover { background: var(--panel); color: var(--ink); }
.nav-item.active { background: var(--accent-bg); border-color: var(--accent-bd); color: var(--ink); }
.nav-item.active .ni-num { color: var(--accent-2); border-color: var(--accent-bd); }
.ni-num {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  border: 1px solid var(--line-2); border-radius: 4px; text-align: center; line-height: 18px; height: 20px;
}
.ni-name { font-weight: 500; letter-spacing: -0.005em; }
.ni-tag {
  font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 20px;
  border: 1px solid var(--line-2); color: var(--muted);
}
.ni-tag.warn { color: var(--warn-2); border-color: var(--warn-bd); background: var(--warn-bg); }
.ni-tag.accent { color: var(--accent-2); border-color: var(--accent-bd); background: var(--accent-bg); }
.ni-tag.good { color: var(--good); border-color: var(--good-bd); background: var(--good-bg); }

.rail-foot {
  border-top: 1px solid var(--line); padding: 12px 16px;
  font-family: var(--mono); font-size: 10.5px; color: var(--faint); line-height: 1.7;
}
.rail-foot .rf-k { color: var(--muted); }

/* ---- main panel ---------------------------------------------------------- */
.main { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.topbar {
  position: relative;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 11px 26px; border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.topbar::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--teal), var(--lime)); }
.crumb { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
.crumb b { color: var(--ink-2); font-weight: 500; }
.status-strip { display: flex; align-items: stretch; gap: 0; border: 1px solid var(--line); border-radius: var(--r);
  overflow: hidden; background: var(--panel); }
.chip { display: flex; flex-direction: column; gap: 1px; padding: 6px 13px; border-right: 1px solid var(--line); }
.chip:last-child { border-right: 0; }
.chip-k { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
.chip-v { font-family: var(--mono); font-size: 12.5px; color: var(--ink); font-weight: 500; }
.chip-v.accent { color: var(--accent-2); }
.chip-v.warn { color: var(--warn-2); }
.chip-v.good { color: var(--good); }

.scroll { overflow-y: auto; flex: 1; min-height: 0; scroll-behavior: smooth; }
.section { max-width: 1180px; margin: 0 auto; padding: 30px 34px 90px; }

/* ---- section title ------------------------------------------------------- */
.section-title { margin-bottom: 22px; }
.section-title-row { display: flex; align-items: flex-start; gap: 16px; }
.section-index {
  font-family: var(--mono); font-size: 13px; color: var(--accent-2);
  border: 1px solid var(--accent-bd); background: var(--accent-bg);
  border-radius: 6px; padding: 4px 9px; line-height: 1; margin-top: 5px;
}
.section-title h1 { margin: 0; font-size: 25px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
.section-sub { margin: 5px 0 0; color: var(--ink-2); font-size: 13.5px; max-width: 76ch; }
.section-title-meta { margin-top: 13px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---- panels -------------------------------------------------------------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); margin-bottom: 18px; }
.panel.flush { padding: 0; overflow: hidden; }
.panel-pad { padding: 18px 20px; }
.panel-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 14px;
  padding: 14px 20px; border-bottom: 1px solid var(--line);
}
.panel-head-l { display: flex; flex-direction: column; gap: 3px; }
.kicker { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-2); }
.panel-title { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
.panel-head-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rule { height: 1px; background: var(--line); margin: 16px 0; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
@media (max-width: 920px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

/* ---- badges / tags ------------------------------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em;
  padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap;
}
.badge-accent { color: var(--accent-2); border-color: var(--accent-bd); background: var(--accent-bg); }
.badge-warn   { color: var(--warn-2);  border-color: var(--warn-bd);  background: var(--warn-bg); }
.badge-good   { color: var(--good);    border-color: var(--good-bd);  background: var(--good-bg); }
.badge-bad    { color: var(--bad);     border-color: var(--bad-bd);   background: var(--bad-bg); }
.badge-ghost  { color: var(--muted); }

.syn-tag, .real-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; font-weight: 500;
  padding: 3px 9px; border-radius: 20px;
}
.syn-tag { color: var(--muted); border: 1px dashed var(--line-2); white-space: nowrap; }
.syn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.real-tag { color: var(--good); border: 1px solid var(--good-bd); background: var(--good-bg); white-space: nowrap; }
.real-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }

.provenance { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--accent-2); }
.prov-mark { font-size: 12px; }

/* ---- stats --------------------------------------------------------------- */
.stat { padding: 13px 15px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); }
.stat-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stat-value { font-size: 19px; margin-top: 5px; color: var(--ink); }
.stat-value.sv-accent { color: var(--accent-2); }
.stat-value.sv-good { color: var(--good); }
.stat-value.sv-warn { color: var(--warn-2); }
.stat-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
.stat-row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 12px; }
@media (max-width: 760px){ .stat-row { grid-auto-flow: row; } }

/* ---- generic data tables ------------------------------------------------- */
table.tbl { width: 100%; border-collapse: collapse; }
table.tbl th, table.tbl td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); }
table.tbl th {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); font-weight: 500; background: var(--panel-2);
}
table.tbl td { font-size: 13px; color: var(--ink-2); }
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl td.k { color: var(--muted); width: 200px; }
table.tbl td.v { color: var(--ink); }
.num { text-align: right; font-family: var(--mono); }

/* ---- adjustment cells ---------------------------------------------------- */
.adj { font-size: 12.5px; }
.adj-neg { color: var(--neg); }
.adj-pos { color: var(--pos); }
.adj-zero { color: var(--faint); }
.adj-big { font-size: 14px; }

/* ---- threshold pills ----------------------------------------------------- */
.thresh-pill {
  display: inline-flex; align-items: center; gap: 7px; cursor: help;
  border-radius: 5px; padding: 3px 4px 3px 8px; border: 1px solid var(--line-2);
}
.tp-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.tp-value { font-size: 11.5px; padding: 1px 6px; border-radius: 4px; }
.tp-ok     { border-color: var(--good-bd); }
.tp-ok .tp-value { color: var(--good); background: var(--good-bg); }
.tp-review { border-color: var(--warn-bd); background: var(--warn-bg); }
.tp-review .tp-label { color: var(--warn-2); }
.tp-review .tp-value { color: var(--warn-2); background: rgba(var(--warn-rgb),0.18); }
.tp-breach { border-color: var(--bad-bd); background: var(--bad-bg); }
.tp-breach .tp-label { color: var(--bad); }
.tp-breach .tp-value { color: var(--bad); background: rgba(var(--bad-rgb),0.18); }

/* ---- contribution bars --------------------------------------------------- */
.contrib-track { position: relative; height: 10px; background: var(--panel-3); border-radius: 3px; overflow: hidden; }
.contrib-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line-strong); }
.contrib-fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.cf-pos { background: var(--accent); }
.cf-neg { background: var(--warn); }

/* ---- value range band ---------------------------------------------------- */
.band-wrap { padding: 30px 26px 22px; }
.band-track { position: relative; height: 16px; border-radius: 8px;
  background: linear-gradient(90deg, var(--panel-3), var(--line-2)); border: 1px solid var(--line-2); }
.band-fill { position: absolute; top: -1px; bottom: -1px; border-radius: 8px;
  background: linear-gradient(90deg, rgba(var(--accent-rgb),0.20), rgba(var(--accent-rgb),0.42), rgba(var(--accent-rgb),0.20));
  border: 1px solid var(--accent-bd); }
.band-point { position: absolute; top: -9px; bottom: -9px; width: 2px; background: var(--accent);
  box-shadow: 0 0 6px rgba(var(--accent-rgb),0.30); }
.band-point::after { content: ""; position: absolute; left: 50%; top: -5px; width: 9px; height: 9px;
  transform: translateX(-50%) rotate(45deg); background: var(--accent-2); }
.band-tick { position: absolute; top: 22px; transform: translateX(-50%); text-align: center; }
.band-tick .bt-v { font-family: var(--mono); font-size: 13px; color: var(--ink); }
.band-tick .bt-l { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.band-comp { position: absolute; top: -22px; transform: translateX(-50%); }
.band-comp .bc-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); border: 1px solid var(--bg); margin: 0 auto; }
.band-comp .bc-l { font-family: var(--mono); font-size: 9px; color: var(--muted); margin-top: 3px; white-space: nowrap; }

/* ---- log / tier widening ------------------------------------------------- */
.tier { border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
.tier-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.tier-no { font-family: var(--mono); font-size: 12px; color: var(--accent-2);
  border: 1px solid var(--accent-bd); background: var(--accent-bg); border-radius: 5px; padding: 3px 8px; }
.tier-title { font-weight: 600; font-size: 13.5px; color: var(--ink); flex: 1; }
.tier-body { padding: 12px 16px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
@media (max-width: 860px){ .tier-body { grid-template-columns: 1fr; } }
.tier-crit { display: flex; flex-direction: column; gap: 5px; }
.tier-crit .tc { display: grid; grid-template-columns: 130px 1fr; gap: 10px; font-size: 12px; }
.tier-crit .tc .tck { font-family: var(--mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding-top: 1px; }
.tier-crit .tc .tcv { color: var(--ink-2); font-family: var(--mono); font-size: 12px; }
.tier-rationale { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
.tier-rationale .tr-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.tier-foot { display: flex; align-items: center; gap: 14px; padding: 9px 16px; border-top: 1px solid var(--line); background: var(--bg-rail); }
.tf-stat { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.tf-stat b { color: var(--ink); }
.tf-pen { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--warn-2); }

/* ---- comp cards ---------------------------------------------------------- */
.comp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
@media (max-width: 980px){ .comp-grid { grid-template-columns: 1fr; } }
.comp-card { border: 1px solid var(--line); border-radius: var(--r2); background: var(--panel); overflow: hidden; }
.comp-card.selected { border-color: var(--line-2); }
.comp-card.rejected { border-color: var(--line); background: var(--bg-rail); opacity: 0.96; }
.cc-head { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-bottom: 1px solid var(--line); }
.cc-id { font-family: var(--mono); font-weight: 600; font-size: 13px; color: var(--ink); }
.cc-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.cc-body { padding: 13px 15px; }
.cc-attrs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px 18px; }
.cc-attr { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; border-bottom: 1px dotted var(--line); padding-bottom: 5px; }
.cc-attr .a-k { color: var(--muted); }
.cc-attr .a-v { color: var(--ink); font-family: var(--mono); font-size: 11.5px; }
.cc-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 15px; border-top: 1px solid var(--line); background: var(--panel-2); }

.reject-strip { display: flex; align-items: center; gap: 10px; padding: 9px 15px; background: var(--bad-bg); border-top: 1px solid var(--bad-bd); }
.reason-code { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--bad); letter-spacing: 0.04em; }
.reject-detail { padding: 12px 15px; font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
.reject-metric { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-family: var(--mono); font-size: 11.5px; }
.reject-metric .rm-bad { color: var(--bad); }
.reject-metric .rm-cap { color: var(--muted); }

/* ---- adjustment GRID (the big table) ------------------------------------- */
.gridwrap { overflow-x: auto; }
table.adjgrid { border-collapse: collapse; width: 100%; min-width: 880px; font-size: 12.5px; }
table.adjgrid th, table.adjgrid td { border: 1px solid var(--line); padding: 8px 12px; vertical-align: top; }
table.adjgrid thead th { background: var(--panel-2); position: sticky; top: 0; z-index: 2; }
table.adjgrid th.row-attr, table.adjgrid td.row-attr {
  position: sticky; left: 0; z-index: 1; background: var(--panel-2);
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--muted); width: 168px; white-space: nowrap;
}
table.adjgrid thead th.row-attr { z-index: 3; }
.col-subject { background: rgba(var(--accent-rgb),0.05) !important; }
.colhead { display: flex; flex-direction: column; gap: 3px; min-width: 132px; align-items: flex-end; }
.colhead .ch-id { font-family: var(--mono); font-weight: 600; font-size: 12px; color: var(--ink); display: flex; align-items: center; gap: 7px; }
.colhead .ch-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.colhead .ch-price { font-family: var(--mono); font-size: 13px; color: var(--ink); }
.cellpair { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
.cellpair .cp-val { color: var(--ink-2); font-family: var(--mono); font-size: 11.5px; }
.cellpair .cp-sub { color: var(--faint); font-family: var(--mono); font-size: 10px; }
.cell-subject .cp-val { color: var(--ink); }
/* matched attribute (comp = subject, zero adjustment): recede so real adjustments stand out */
.cell-match .cp-val { color: var(--faint); }
.gridfoot td { background: var(--panel-2); font-family: var(--mono); }
.gridfoot td:not(.row-attr) { text-align: right; }
.gridfoot .fl-label { color: var(--muted); font-size: 11px; }
/* summary block (net/gross/tolerance/adjusted) separated from the per-attribute rows */
table.adjgrid tfoot tr:first-child td { border-top: 2px solid var(--line-strong); }
.gridfoot-total td { border-top: 1px solid var(--line-3); }
.gf-pills { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.adjusted-val { font-size: 14px; color: var(--ink); font-weight: 600; }
.subject-anchor { color: var(--accent-2); font-family: var(--mono); }

/* ---- flag registry ------------------------------------------------------- */
.flag-row { display: grid; grid-template-columns: 26px 200px 1fr; gap: 14px; align-items: start;
  padding: 13px 18px; border-bottom: 1px solid var(--line); }
.flag-row:last-child { border-bottom: 0; }
.flag-led { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; }
.led-fired { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
.led-info  { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.led-clear { background: var(--line-2); }
.flag-code { font-family: var(--mono); font-size: 12.5px; color: var(--ink); font-weight: 600; }
.flag-trigger { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.flag-detail { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
.flag-status { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 20px; align-self: start; }
.fs-fired { color: var(--warn-2); border: 1px solid var(--warn-bd); background: var(--warn-bg); }
.fs-info  { color: var(--accent-2); border: 1px solid var(--accent-bd); background: var(--accent-bg); }
.fs-clear { color: var(--muted); border: 1px solid var(--line-2); }
.flag-meta { display: flex; align-items: center; gap: 8px; }

/* ---- driver bars list ---------------------------------------------------- */
.driver { display: grid; grid-template-columns: 190px 1fr 78px; gap: 16px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.driver:last-child { border-bottom: 0; }
.driver-l .dl-name { font-size: 13px; color: var(--ink); }
.driver-l .dl-detail { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.driver-v { font-family: var(--mono); font-size: 13px; text-align: right; }
.dv-pos { color: var(--accent-2); }
.dv-neg { color: var(--warn-2); }

/* ---- benchmark sparkline (time adj) -------------------------------------- */
.spark { display: flex; align-items: flex-end; gap: 3px; height: 46px; }
.spark .sb { flex: 1; background: var(--line-2); border-radius: 1px; min-height: 3px; }
.spark .sb.eff { background: var(--accent); }

/* ---- memo doc ------------------------------------------------------------ */
.memo-doc { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); }
.memo-band { padding: 20px 28px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; flex-wrap: wrap; }
.memo-h { font-size: 20px; font-weight: 600; color: var(--ink); margin: 0; letter-spacing: -0.01em; }
.memo-sec { padding: 20px 28px; border-bottom: 1px solid var(--line); }
.memo-sec:last-child { border-bottom: 0; }
.memo-sec h4 { margin: 0 0 10px; font-size: 11px; font-family: var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-2); }
.memo-prose { font-size: 13.5px; line-height: 1.66; color: var(--ink-2); max-width: 84ch; }
.memo-prose p { margin: 0 0 11px; }
.memo-prose p:last-child { margin-bottom: 0; }
.llm-note { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; color: var(--muted);
  border: 1px dashed var(--line-2); border-radius: 5px; padding: 2px 8px; margin-bottom: 12px; }

/* ---- §07 agent trace: verdict line + compact delta table + collapsible raw trace -------- */
.agent-verdict { font-size: 14px; line-height: 1.6; font-weight: 600; color: var(--ink);
  margin: 0 0 14px; max-width: 84ch; }
.delta-tbl { margin: 0 0 16px; }
.delta-tbl td, .delta-tbl th { font-variant-numeric: tabular-nums; }
.delta-tbl td.k { width: 280px; color: var(--ink-2); }
.delta-tbl td.delta-moved { color: var(--warn-2); font-weight: 600; background: var(--warn-bg); }
.agent-trace-toggle { margin-top: 2px; }
.trace-toggle-btn { display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
  background: none; border: 0; padding: 6px 0; font-family: var(--mono); font-size: 10.5px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-2); }
.trace-toggle-btn:hover { color: var(--accent); }
.ttb-count { color: var(--faint); letter-spacing: 0.06em; text-transform: none; }
.agent-md > :first-child { margin-top: 0; }
.agent-md-h { font-weight: 600; color: var(--ink); margin: 13px 0 5px; font-size: 13px; }
.agent-md-ul { margin: 5px 0 11px; padding-left: 18px; }
.agent-md-ul li { margin: 2px 0; }

.note-line { font-size: 11.5px; color: var(--muted); line-height: 1.55; }
.callout { border-left: 2px solid var(--accent-bd); background: var(--accent-bg); padding: 11px 15px; border-radius: 0 6px 6px 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
.callout.warn { border-left-color: var(--warn-bd); background: var(--warn-bg); }
.tip { font-size: 12px; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 11px; height: 11px; border-radius: 3px; }

/* ============================================================================
   HIERARCHY LAYER — one hero metric per page, demoted captions, open groups.
   Reduces the "wall of bordered panels" so the eye gets entry points and the
   adjustment grid can read as the single heavy analytical surface.
   ========================================================================== */
/* lead: the dominant figure that opens a page, with generous rest below */
.lead { margin: 4px 0 34px; }
.lead-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 36px; flex-wrap: wrap; }
.lead-main { min-width: 300px; flex: 1; }
.hero-eyebrow {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 11px;
}
.hero-figure {
  font-family: var(--serif); font-weight: 600; letter-spacing: -0.02em;
  font-size: 42px; line-height: 1.03; color: var(--ink); margin: 0;
}
.hero-figure.sentence { font-size: 30px; letter-spacing: -0.015em; line-height: 1.12; }
.hero-figure .hf-accent { color: var(--accent-2); }
.hero-figure .hf-mut { color: var(--muted); }
.hero-figure .hf-sep { color: var(--line-strong); font-weight: 400; margin: 0 8px; }
.hero-figure .hf-arrow { color: var(--line-strong); font-weight: 400; margin: 0 6px; }
.hero-caption {
  font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 14px;
  letter-spacing: 0.01em; line-height: 1.65; max-width: 70ch;
}
.hero-caption b { color: var(--ink-2); font-weight: 500; }
.lead-aside { text-align: right; padding-top: 2px; }
.lead-aside .la-fig { font-family: var(--serif); font-weight: 600; font-size: 27px; color: var(--ink); letter-spacing: -0.01em; }
.lead-aside .la-fig.good { color: var(--good); }
.lead-aside .la-cap { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 5px; line-height: 1.5; }

/* open group: a labelled region separated by whitespace — no surrounding box,
   so the only borders are the genuinely-distinct objects inside it */
.group { margin: 0 0 38px; }
.group:last-child { margin-bottom: 8px; }
.group-label {
  display: flex; align-items: center; gap: 14px; margin: 0 0 15px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--faint);
}
.group-label .gl-count { color: var(--muted); }
.group-label .gl-line { flex: 1; height: 1px; background: var(--line); }
.group-label .gl-right { letter-spacing: 0.02em; text-transform: none; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }

/* quiet reference table — borderless, hairline rows; for subject attributes */
.reftable { width: 100%; border-collapse: collapse; }
.reftable td { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: baseline; }
.reftable tr:last-child td { border-bottom: 0; }
.reftable td.k { color: var(--muted); width: 46%; }
.reftable td.v { color: var(--ink); font-family: var(--mono); font-size: 12px; }

/* a single demoted context line (replaces clusters of context stat cards) */
.context-line { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.75; }
.context-line b { color: var(--ink); font-weight: 500; }
.context-line .cl-sep { color: var(--line-strong); margin: 0 8px; }

/* ---- KV serif display: headings + large numbers ---- */
.brand-title { font-family: var(--serif); font-weight: 600; }
.section-title h1 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.015em; }
.panel-title { font-family: var(--serif); font-weight: 600; letter-spacing: 0; }
.memo-h { font-family: var(--serif); font-weight: 600; }
.stat-value { font-family: var(--serif); font-weight: 600; letter-spacing: -0.005em; }
.adjusted-val { font-family: var(--serif); font-size: 15px; }
.band-tick .bt-v { font-family: var(--serif); font-size: 15px; }
.memo-prose { font-family: var(--sans); }

</style>
</head>
<body>
<div id="root"></div>

<!-- KV Capital brand: single fixed palette (no theme switcher) -->

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- Case snapshots. data.js (the South hero) loads FIRST and stays the default, so the
     single-case path is unchanged. Each file is a frozen window.MEMO produced by the Python
     core; the inline captures stash each one under a per-case global. East/West are optional —
     if absent the switcher simply offers only the cases that loaded. NO math happens in JS. -->
<script src="data.js"></script>
<script>window.MEMO_SOUTH = window.MEMO;</script>
<script src="data.east.js"></script>
<script>window.MEMO_EAST = window.MEMO;</script>
<script src="data.west.js"></script>
<script>window.MEMO_WEST = window.MEMO;</script>
<script>window.MEMO = window.MEMO_SOUTH;</script>
<script type="text/babel" data-presets="react">

/* ===== shared.jsx ===== */
/* Shared primitives — formatters, badges, pills, bars, section chrome */

// Case registry — each entry is a frozen window.MEMO produced by the Python core. Switching
// cases ONLY reassigns the module-level `M` binding (which every component reads by closure)
// and re-renders; no underwriting number is ever recomputed in JS. Labels describe what each
// case TEACHES (see in §07's sensitivity probe), not internal nicknames. East is the landing
// case — it's the one where the value holds but confidence is genuinely sensitive.
const CASES = [
  { key: "east",  name: "East · sensitive (confidence drops under forced wider search)", memo: window.MEMO_EAST },
  { key: "south", name: "South · stable (value holds under every probe)",                memo: window.MEMO_SOUTH },
  { key: "west",  name: "West · clean (high-value, fewest flags raised)",                memo: window.MEMO_WEST },
].filter((c) => c.memo);
let M = CASES.find((c) => c.key === "east")?.memo || CASES[0].memo;
// The usd0/sgn/pct helpers are byte-identical across snapshots, so destructuring once is safe.
const { usd0, sgn, pct } = M;

// thin underline-style section header used inside panels
function PanelHead({ kicker, title, right }) {
  return (
    <div className="panel-head">
      <div className="panel-head-l">
        {kicker && <div className="kicker">{kicker}</div>}
        <h3 className="panel-title">{title}</h3>
      </div>
      {right && <div className="panel-head-r">{right}</div>}
    </div>
  );
}

// big numbered section title at top of a section
function SectionTitle({ index, name, sub, meta }) {
  return (
    <header className="section-title">
      <div className="section-title-row">
        <span className="section-index">{index}</span>
        <div>
          <h1>{name}</h1>
          {sub && <p className="section-sub">{sub}</p>}
        </div>
      </div>
      {meta && <div className="section-title-meta">{meta}</div>}
    </header>
  );
}

function Badge({ tone = "neutral", children, title }) {
  return (
    <span className={"badge badge-" + tone} title={title}>
      {children}
    </span>
  );
}

function SyntheticTag() {
  return (
    <span className="syn-tag" title="Comparable data is synthetic / illustrative">
      <span className="syn-dot" />SYNTHETIC
    </span>
  );
}

function RealTag() {
  return (
    <span className="real-tag" title="Grounded in Open Calgary assessment data">
      <span className="real-dot" />REAL DATA
    </span>
  );
}

// signed money cell with directional color
function AdjCell({ v, big }) {
  const cls = v < 0 ? "adj-neg" : v > 0 ? "adj-pos" : "adj-zero";
  return (
    <span className={"mono adj " + cls + (big ? " adj-big" : "")}>
      {v === 0 ? "\u2014" : sgn(v)}
    </span>
  );
}

// threshold pill: green within / amber review / red breach
function ThreshPill({ label, value, reviewAt, hardAt }) {
  let tone = "ok";
  if (value > hardAt) tone = "breach";
  else if (value > reviewAt) tone = "review";
  const tip =
    tone === "ok"
      ? `${label} ${value.toFixed(1)}% \u00b7 within tolerance (review ${reviewAt}% / cap ${hardAt}%)`
      : tone === "review"
      ? `${label} ${value.toFixed(1)}% \u00b7 above ${reviewAt}% review band, within ${hardAt}% cap \u2014 narrative flag, not a failure`
      : `${label} ${value.toFixed(1)}% \u00b7 exceeds ${hardAt}% cap`;
  return (
    <span className={"thresh-pill tp-" + tone} title={tip}>
      <span className="tp-label">{label}</span>
      <span className="tp-value mono">{value.toFixed(1)}%</span>
    </span>
  );
}

// horizontal contribution bar (signed), centered at zero
function ContribBar({ value, max = 0.16 }) {
  const w = (Math.abs(value) / max) * 50; // % of half-track
  const pos = value >= 0;
  return (
    <div className="contrib-track">
      <div className="contrib-mid" />
      <div
        className={"contrib-fill " + (pos ? "cf-pos" : "cf-neg")}
        style={{
          left: pos ? "50%" : `calc(50% - ${w}%)`,
          width: w + "%",
        }}
      />
    </div>
  );
}

// labeled stat (mono value)
function Stat({ label, value, tone, sub }) {
  return (
    <div className="stat">
      <div className="stat-label">{label}</div>
      <div className={"stat-value mono " + (tone ? "sv-" + tone : "")}>{value}</div>
      {sub && <div className="stat-sub">{sub}</div>}
    </div>
  );
}

function Provenance({ children }) {
  return (
    <span className="provenance mono" title="Data provenance">
      <span className="prov-mark">{"\u2295"}</span>
      {children}
    </span>
  );
}

function Rule() {
  return <div className="rule" />;
}

Object.assign(window, {
  PanelHead, SectionTitle, Badge, SyntheticTag, RealTag, AdjCell,
  ThreshPill, ContribBar, Stat, Provenance, Rule,
});


/* ===== sec_subject.jsx ===== */
/* Section 1 — SUBJECT (grounded in open_calgary_assessment) */
function SubjectSection() {
  const s = M.subject;
  const mc = M.marketContext;
  return (
    <section className="section" data-screen-label="Subject">
      <SectionTitle
        index="01"
        name="Subject Property"
        sub="Single-family detached collateral grounded in Open Calgary assessment data. Characteristics below anchor every downstream comparable adjustment."
        meta={
          <React.Fragment>
            <RealTag />
            <Provenance>{s.provenance}</Provenance>
            <Badge tone="ghost">roll {s.roll}</Badge>
          </React.Fragment>
        }
      />

      <div className="lead lead-split">
        <div className="lead-main">
          <div className="hero-eyebrow">subject collateral · {s.community}, {s.district} ({s.quadrant})</div>
          <h2 className="hero-figure sentence">{s.addr}</h2>
          <div className="hero-caption">
            <b>Single-family detached</b> · {s.gla.toLocaleString()} sf above grade · {s.lot.toLocaleString()} sf site · {s.beds} bed / {s.bathFull}F·{s.bathHalf}H · built {s.yearBuilt} ({s.age} yr) · {s.condition} / {s.quality} · {s.landUse}
            <br />{s.addrNote}.
          </div>
        </div>
        <div className="lead-aside">
          <div className="la-fig good">{M.usd0(s.assessedValue)}</div>
          <div className="la-cap">assessed value · {s.assessmentRollYear} roll<br />val. date {s.assessmentValDate} · ${s.ppsfAssessed}/sf</div>
        </div>
      </div>

      <div className="group">
        <div className="group-label">improvement &amp; site<span className="gl-line" /><span className="gl-right">effective {s.effDate}</span></div>
        <div className="grid-2">
          <table className="reftable"><tbody>{s.attrs.slice(0, Math.ceil(s.attrs.length / 2)).map(([k, v]) => (
            <tr key={k}><td className="k">{k}</td><td className="v">{v}</td></tr>
          ))}</tbody></table>
          <table className="reftable"><tbody>{s.attrs.slice(Math.ceil(s.attrs.length / 2)).map(([k, v]) => (
            <tr key={k}><td className="k">{k}</td><td className="v">{v}</td></tr>
          ))}</tbody></table>
        </div>
      </div>

      <div className="group">
        <div className="group-label">market context<span className="gl-line" /><span className="gl-right">{mc.series}</span></div>
        <div className="context-line">
          {s.district} district benchmark <b>{M.usd0(mc.southBenchmark)}</b><span className="cl-sep">·</span>
          city benchmark <b>{M.usd0(mc.cityBenchmark)}</b><span className="cl-sep">·</span>
          benchmark <b>${mc.ppsf}/sf</b><span className="cl-sep">·</span>
          subject age <b>{s.age} yr</b><span className="cl-sep">·</span>detached · 2026-06
        </div>
        <div className="callout" style={{ marginTop: 16 }}>
          The assessed value reflects a <b>{s.assessmentValDate}</b> valuation date and lags the current market; it is shown
          for provenance, <b>not</b> as a market opinion. The defensible value is developed independently from comparable
          sales in the sections that follow.
        </div>
      </div>
    </section>
  );
}
window.SubjectSection = SubjectSection;


/* ===== sec_comps.jsx ===== */
/* Section 2 — COMP SELECTION (tiered widening + selected + rejected) */
function SearchSummaryBar() {
  const ss = M.searchSummary;
  return (
    <div className="lead">
      <div className="hero-eyebrow">retrieval funnel · post de-dupe</div>
      <h2 className="hero-figure sentence">
        {ss.retrieved} candidates <span className="hf-arrow">→</span> <span className="hf-accent">{ss.selected} selected</span> <span className="hf-sep">·</span> <span className="hf-mut">{ss.rejected} rejected</span>
      </h2>
      <div className="hero-caption">
        final tier <b>{ss.finalTier}</b> · widening depth <b>{ss.wideningDepth}</b> · confidence penalty <b>{ss.totalPenalty.toFixed(2)}</b> from search relaxation
      </div>
    </div>
  );
}

function TierBlock({ t }) {
  return (
    <div className="tier">
      <div className="tier-head">
        <span className="tier-no">T{t.tier}</span>

const GARAGE_ABBR = { attached: "att.", detached: "det.", tandem: "tan.", none: "none" };

function AdjustmentGridSection() {

          <React.Fragment>
            <SyntheticTag />
            <span className="legend">

              <span className="lg"><span className="sw" style={{ background: "var(--pos)" }} />inferior → + adj</span>
            </span>
          </React.Fragment>
        }
      />

      <div className="panel flush">
        <PanelHead kicker="rate card" title="Documented adjustment rates"
          right={<Badge tone="ghost">applied uniformly across all comps</Badge>} />
        <div className="panel-pad" style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>

            ["GLA", `$${r.gla} / sf`], ["Lot", `$${r.lot} / sf`], ["Bed", `$${r.bed.toLocaleString()}`],
            ["Full bath", `$${r.bathFull.toLocaleString()}`], ["Half bath", `$${r.bathHalf.toLocaleString()}`], ["Basement", `$${r.basement} / sf`],
            ["Garage", `$${r.garage.toLocaleString()} / stall`], ["Age", `$${r.age.toLocaleString()} / yr`], ["Condition", `$${r.condition.toLocaleString()} / step`],
            ["Quality", `$${r.quality.toLocaleString()} / step`], ["Time", "CREB benchmark"],
          ].map(([k, v]) => (
            <div key={k} style={{ display: "flex", gap: 7, alignItems: "baseline", border: "1px solid var(--line)", borderRadius: 5, padding: "5px 10px" }}>
              <span style={{ fontFamily: "var(--mono)", fontSize: 10.5, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.06em" }}>{k}</span>
              <span className="mono" style={{ fontSize: 12, color: "var(--ink)" }}>{v}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="panel flush">
        <div className="gridwrap">
          <table className="adjgrid">
            <thead>
              <tr>
                <th className="row-attr">Attribute</th>
                <th className="col-subject">
                  <div className="colhead">
                    <span className="ch-id"><span className="subject-anchor">◆</span> SUBJECT</span>
                    <span className="ch-sub">eff. {s.effDate}</span>
                    <span className="ch-price subject-anchor">anchor</span>
                  </div>
                </th>
                {comps.map((c) => (
                  <th key={c.id}>
                    <div className="colhead">
                      <span className="ch-id">{c.label}</span>
                      <span className="ch-sub">{c.contractDate} · {c.distanceKm}km</span>
                      <span className="ch-price">{M.usd0(c.price)}</span>

              </tr>
            </thead>
            <tbody>
              {rowOrder.map((row) => (
                <tr key={row.key}>
                  <td className="row-attr">{row.label}</td>
                  <td className="col-subject cell-subject">

                      <span className="cp-val">{subjectVals[row.key][0]}</span>
                      <span className="cp-sub">{subjectVals[row.key][1]}</span>
                    </div>
                  </td>
                  {comps.map((c) => {
                    const ln = c.lines.find((l) => l.key === row.key);
                    return (
                      <td key={c.id} className={ln.adj === 0 ? "cell-match" : undefined}>
                        <div className="cellpair">
                          <span className="cp-val">{ln.sub}</span>
                          <AdjCell v={ln.adj} />

                      </td>

                  })}
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr className="gridfoot">
                <td className="row-attr">Net adjustment</td>
                <td className="col-subject mono" style={{ color: "var(--faint)" }}>—</td>

                  <td key={c.id}><AdjCell v={c.net} big /></td>

                <td className="row-attr">Gross adjustment</td>
                <td className="col-subject mono" style={{ color: "var(--faint)" }}>—</td>
                {comps.map((c) => (
                  <td key={c.id}><span className="mono" style={{ color: "var(--ink-2)" }}>{M.usd0(c.gross)}</span></td>

                <td className="col-subject mono" style={{ color: "var(--faint)" }}>—</td>

          </div>
          {(() => {
            const adj = comps.find((c) => !c.sameDistrict);
            return adj ? (
              <div className="note-line" style={{ marginTop: 12 }}>
                <b style={{ color: "var(--ink-2)" }}>Note on {adj.label}.</b> Its adjacent-district location is absorbed through distance-weighting in
                Reconciliation rather than an explicit grid line, keeping the grid to the documented subject attributes. The choice is
                recorded as flag <span className="mono" style={{ color: "var(--accent-2)" }}>ADJACENT_DISTRICT_COMP</span>.
              </div>
            ) : null;
          })()}
        </div>
      </div>
    </section>
  );
}
window.AdjustmentGridSection = AdjustmentGridSection;


/* ===== sec_reconciliation.jsx ===== */
/* Section 4 — RECONCILIATION (weighted → value RANGE) */
function ValueBand() {
  const r = M.range;
  const comps = M.selected;
  // Axis computed from the actual adjusted-value envelope AND the reported range, padded, so
  // off-hero dots never fall off the track (no South-locked 702k–728k window).
  const lo = Math.min(r.low, ...M.adjustedVals);
  const hi = Math.max(r.high, ...M.adjustedVals);
  const pad = (hi - lo) * 0.12 || 1000;
  const axisMin = lo - pad, axisMax = hi + pad;
  const span = axisMax - axisMin;
  const pos = (v) => ((v - axisMin) / span) * 100;
  return (
    <div className="band-wrap">
      <div style={{ position: "relative", height: 90 }}>
        <div className="band-track">
          <div className="band-fill" style={{ left: pos(r.low) + "%", width: (pos(r.high) - pos(r.low)) + "%" }} />
          <div className="band-point" style={{ left: pos(r.point) + "%" }} />
          {comps.map((c) => (
            <div className="band-comp" key={c.id} style={{ left: pos(c.adjusted) + "%" }} title={c.label + " · " + M.usd0(c.adjusted)}>
              <div className="bc-dot" />
              <div className="bc-l">{c.label.replace("COMP-", "")}</div>
            </div>
          ))}
          <div className="band-tick" style={{ left: pos(r.low) + "%" }}>
            <div className="bt-v">{M.usd0(r.low)}</div><div className="bt-l">low</div>
          </div>
          <div className="band-tick" style={{ left: pos(r.point) + "%" }}>
            <div className="bt-v" style={{ color: "var(--accent-2)" }}>{M.usd0(r.point)}</div><div className="bt-l" style={{ color: "var(--accent-2)" }}>weighted point</div>
          </div>
          <div className="band-tick" style={{ left: pos(r.high) + "%" }}>
            <div className="bt-v">{M.usd0(r.high)}</div><div className="bt-l">high</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function ReconciliationSection() {
  const comps = M.selected;
  const r = M.range;
  const t = M.thresholds;
  const wd = M.weightDrivers;
  // Null-guard: with no selected comps, Math.min/max(...[]) yields ±Infinity (NaN bars and
  // an "$Infinity" envelope). Render a notice instead.
  if (!comps.length) {
    return (
      <section className="section" data-screen-label="Reconciliation">
        <SectionTitle index="04" name="Reconciliation"
          sub="No comparable sales were selected, so no value range can be reconciled." />
        <div className="note-line">Reconciliation unavailable — the selection step retained no comparables.</div>
      </section>
    );
  }
  const maxW = Math.max(...comps.map((c) => M.weights[c.id]));
  // Range spread reported as ONE figure everywhere: $ from the range, % from spreadPct.
  const rangeSpread = r.high - r.low;
  const insideRange = M.adjustedVals.filter((v) => v >= r.low && v <= r.high).length;
  // Generalised weight-derivation prose — driven from the data, not South-locked labels.
  const anchor = comps.length ? comps.reduce((a, b) => (M.weights[a.id] >= M.weights[b.id] ? a : b)) : null;
  const heavy = comps.length ? comps.reduce((a, b) => (a.grossPct >= b.grossPct ? a : b)) : null;
  const adj = comps.find((c) => !c.sameDistrict);
  return (
    <section className="section" data-screen-label="Reconciliation">
      <SectionTitle
        index="04"
        name="Reconciliation"
        sub="Adjusted values are reconciled by weight, never by simple average — emphasising the most similar, most recent, and least-adjusted evidence. The output is a defensible RANGE with a weighted central indication, never a bare single number."
      />

      <div className="panel flush">
        <PanelHead kicker="indication" title="Supported value range"
          right={<Badge tone="accent">spread ±{(r.spreadPct / 2).toFixed(1)}%</Badge>} />
        <ValueBand />
        <div className="panel-pad" style={{ borderTop: "1px solid var(--line)" }}>
          <div className="context-line">
            bracketing <b>{insideRange} / {M.adjustedVals.length}</b> comps inside range<span className="cl-sep">·</span>
            adjusted values <b>{M.usd0(Math.min(...M.adjustedVals))}–{M.usd0(Math.max(...M.adjustedVals))}</b><span className="cl-sep">·</span>
            range spread <b>${rangeSpread.toLocaleString()}</b> ({r.spreadPct.toFixed(1)}% of point)
          </div>
        </div>
        <div className="panel-pad" style={{ borderTop: "1px solid var(--line)" }}>
          <div className="callout">
            The weighted central point <b className="mono">{M.usd0(r.point)}</b> is reported as the midpoint of a defensible range, not as
            "the value." {insideRange} of {M.adjustedVals.length} adjusted comparables fall within <b className="mono">{M.usd0(r.low)}–{M.usd0(r.high)}</b>; the supported range is the deliverable.
          </div>
        </div>
      </div>

      <div className="group">
        <div className="group-label">per-comp weight derivation<span className="gl-line" /><span className="gl-right">similarity × recency × distance × adj-burden</span></div>
        <div>
          <table className="tbl" style={{ marginBottom: 4 }}>
            <thead>
              <tr>
                <th>Comp</th><th>Adjusted value</th><th>Similarity</th><th>Recency</th>
                <th>Distance</th><th>Adj burden</th><th style={{ width: 230 }}>Weight</th>
              </tr>
            </thead>
            <tbody>
              {comps.map((c) => {
                const w = M.weights[c.id];
                return (
                  <tr key={c.id}>
                    <td className="v mono" style={{ fontWeight: 600 }}>{c.label}</td>
                    <td className="mono v">{M.usd0(c.adjusted)}</td>
                    <td className="mono">{wd[c.id].similarity}</td>
                    <td className="mono">{wd[c.id].recency}</td>
                    <td className="mono">{wd[c.id].distance}</td>
                    <td className="mono" style={{ color: c.grossPct > t.grossReview ? "var(--warn-2)" : "var(--ink-2)" }}>{wd[c.id].burden}</td>
                    <td>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <div style={{ flex: 1, height: 9, background: "var(--panel-3)", borderRadius: 3, overflow: "hidden" }}>
                          <div style={{ width: (w / maxW * 100) + "%", height: "100%", background: "var(--accent)", borderRadius: 3 }} />
                        </div>
                        <span className="mono" style={{ width: 38, textAlign: "right", color: "var(--accent-2)" }}>{(w * 100).toFixed(0)}%</span>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="note-line" style={{ marginTop: 10 }}>
            {anchor && <React.Fragment>{anchor.label} leads on similarity, recency, and proximity with the lightest adjustment burden, so it anchors the
            indication. </React.Fragment>}
            {heavy && heavy.grossPct > t.grossReview && <React.Fragment>{heavy.label} is down-weighted for its {heavy.grossPct.toFixed(1)}% gross adjustment</React.Fragment>}
            {adj && <React.Fragment>{heavy && heavy.grossPct > t.grossReview ? "; " : ""}{adj.label} for adjacent-district location and a {adj.ageDays}-day contract age</React.Fragment>}
            {(heavy && heavy.grossPct > t.grossReview) || adj ? ". " : ""}Weights sum to 100%.
          </div>
        </div>
      </div>
    </section>
  );
}
window.ReconciliationSection = ReconciliationSection;


/* ===== sec_confidence.jsx ===== */
/* Section 5 — CONFIDENCE + FLAGS */
function ConfidenceBand() {
  const cf = M.confidence;
  const axisMin = 0.45, axisMax = 0.90;
  const pos = (v) => ((v - axisMin) / (axisMax - axisMin)) * 100;
  return (
    <div className="band-wrap">
      <div style={{ position: "relative", height: 64 }}>
        <div className="band-track" style={{ background: "linear-gradient(90deg, var(--bad-bg), var(--warn-bg), var(--good-bg))" }}>
          <div className="band-fill" style={{ left: pos(cf.low) + "%", width: (pos(cf.high) - pos(cf.low)) + "%" }} />
          <div className="band-point" style={{ left: pos(cf.score) + "%" }} />
          <div className="band-tick" style={{ left: pos(cf.low) + "%" }}>
            <div className="bt-v">{cf.low.toFixed(2)}</div><div className="bt-l">floor</div>
          </div>
          <div className="band-tick" style={{ left: pos(cf.score) + "%" }}>
            <div className="bt-v" style={{ color: "var(--accent-2)" }}>{cf.score.toFixed(2)}</div><div className="bt-l" style={{ color: "var(--accent-2)" }}>{cf.band}</div>
          </div>
          <div className="band-tick" style={{ left: pos(cf.high) + "%" }}>
            <div className="bt-v">{cf.high.toFixed(2)}</div><div className="bt-l">ceiling</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function FlagRow({ f }) {
  const ledCls = f.status === "CLEAR" ? "led-clear" : f.severity === "info" ? "led-info" : "led-fired";
  const stCls = f.status === "CLEAR" ? "fs-clear" : f.severity === "info" ? "fs-info" : "fs-fired";
  return (
    <div className="flag-row">

/* App shell — nav rail, topbar status strip, section router */
const { useState, useEffect } = React;

/* Section 7 — Agent Trace (READ-ONLY).
   An audit of the two LLM agents that BRACKET the deterministic pipeline: intake grounding
   before, sensitivity probing after. Pure render — no inputs, no chat, zero interactivity.
   Every number stays computed by the Python core; the agents only choose tools and write
   prose. Degrades gracefully when a snapshot carries no agentTrace block. */
function AgentCallList({ calls }) {
  if (!calls || !calls.length) return null;
  // Each call stacks vertically — the call signature on one line, its result wrapping below —
  // so variable-length args never collide with the result column.
  return (
    <div style={{ marginTop: 10 }}>
      {calls.map((c, i) => (
        <div key={i} className="mono"
          style={{ fontSize: 11.5, padding: "7px 0", borderTop: "1px solid var(--line)" }}>
          <div style={{ display: "flex", gap: 8, alignItems: "baseline" }}>
            <span style={{ color: "var(--faint)", flex: "0 0 16px" }}>{i + 1}</span>
            <span style={{ color: "var(--accent)", overflowWrap: "anywhere", minWidth: 0 }}>{c.name}
              <span style={{ color: "var(--faint)" }}>({c.args})</span></span>
          </div>
          <div style={{ color: "var(--muted)", margin: "3px 0 0 24px",
                        overflowWrap: "anywhere", whiteSpace: "pre-wrap" }}>{c.result}</div>
        </div>
      ))}
    </div>
  );
}

/* Verbatim readers. Every figure in §07 ALREADY EXISTS inside the prose the core authored
   (intake.reasoning, sensitivity.note). These helpers RE-READ those figures as substrings —
   they parse, they never compute. If the grammar ever drifts, a reader returns null and the
   caller falls back to the original prose, with the full raw trace always present below. So
   the viewer can never become the author of a number it merely displays. */

// Intake: pull the three provenance counts out of the grounding sentence the core wrote.
function readIntakeProvenance(reasoning) {
  if (!reasoning) return null;
  const oc = reasoning.match(/grounded\s+(\d+)\s+identity\/assessment field\(s\) from Open Calgary/);
  const ls = reasoning.match(/read\s+(\d+)\s+attribute\(s\) from the listing/);
  const fb = reasoning.match(/fell back to CREB district-typical values for\s+(\d+)\s+field\(s\)\s*\(([^)]*)\)/);
  if (!oc || !ls || !fb) return null;
  const openCalgary = +oc[1], listing = +ls[1], estimated = +fb[1];
  return { openCalgary, listing, estimated, estNames: fb[2], total: openCalgary + listing + estimated };
}

// Scan any text for per-scenario delta lines and return parsed rows (or null). The grammar is
// the deterministic engine's compare line: "[label] point $A -> $B (moved); range ...;
// confidence LVL c1 -> LVL c2; selected s1 -> s2; fired flags f1 -> f2."  We capture only the
// cells the table shows; pointHeld is decided by comparing the two dollar values, so it is
// correct whether the point moved or not.
function scenarioRows(text) {
  if (!text) return null;
  const re = /\[([^\]]+)\]\s*point\s+(\$[\d,]+)\s*->\s*(\$[\d,]+)\s*(\([^)]*\))?[^;]*;[^;]*;\s*confidence\s+(\w+)\s+([\d.]+)\s*->\s*(\w+)\s+([\d.]+);\s*selected\s+(\d+)\s*->\s*(\d+);\s*fired flags\s+(\d+)\s*->\s*(\d+)/g;
  const rows = [];
  let m;
  while ((m = re.exec(text)) !== null) {
    rows.push({
      label: m[1].trim(),
      pointFrom: m[2], pointTo: m[3], pointHeld: m[2] === m[3],
      confLvlFrom: m[5], confFrom: m[6], confLvlTo: m[7], confTo: m[8],
      confChanged: m[6] !== m[8] || m[5] !== m[7], confLevelDropped: m[5] !== m[7],
      flagsFrom: m[11], flagsTo: m[12], flagsChanged: m[11] !== m[12],
    });
  }
  return rows.length ? rows : null;
}

// Read the sensitivity delta rows. PREFER the deterministic tool-call results — they carry the
// structured compare grammar in BOTH template and LLM mode (the LLM cannot alter a tool's
// output, only choose which tools to run), so the table survives a model-authored note. Fall
// back to the prose note for older/truncated snapshots whose call results were capped short.
function readSensitivityRows(sensitivity) {
  if (!sensitivity) return null;
  const fromCalls = (sensitivity.calls || []).map((c) => c.result).join("\n");
  return scenarioRows(fromCalls) || scenarioRows(sensitivity.note);
}

// One plain-language sentence, phrased from the rows actually present — not hardcoded.
function sensitivityVerdict(rows) {
  const stripParen = (s) => s.replace(/\s*\([^)]*\)/g, "").trim();
  const held = rows.every((r) => r.pointHeld);
  const dropped = rows.filter((r) => r.confLevelDropped);
  if (held && dropped.length === 0) return "Value and confidence hold under every probe.";
  if (held) {
    const lvl = dropped[0].confLvlTo;
    const which = dropped.map((d) => stripParen(d.label)).join(", ");
    return `Value holds under all ${rows.length} probes; confidence falls to ${lvl} only under ${which}.`;
  }
  return "The point indication shifts under at least one probe — see the table below.";
}

// Compact delta table (sensitivity only). One row per scenario; a cell is highlighted ONLY
// when it moved, so the eye lands on what changed. Arrow read straight from the payload's "->".
function SensitivityDeltaTable({ rows }) {
  if (!rows || !rows.length) return null;
  const pretty = (s) => s.replace(/\s*->\s*/g, " → ");
  return (
    <table className="tbl delta-tbl">
      <thead>
        <tr><th>Scenario</th><th>Point</th><th>Confidence</th><th>Flags</th></tr>
      </thead>
      <tbody>
        {rows.map((r, i) => (
          <tr key={i}>
            <td className="k">{pretty(r.label)}</td>
            <td>{r.pointHeld ? `${r.pointFrom} → unchanged` : `${r.pointFrom} → ${r.pointTo}`}</td>
            <td className={r.confChanged ? "delta-moved" : ""}>
              {r.confFrom} {"→"} {r.confTo}{r.confLevelDropped ? ` ${r.confLvlTo}` : ""}
            </td>
            <td className={r.flagsChanged ? "delta-moved" : ""}>{r.flagsFrom} {"→"} {r.flagsTo}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

// Minimal Markdown renderer for the agent prose. LLM-authored notes arrive as Markdown
// (## headings, **bold**, - bullets); the deterministic template arrives as plain text. This
// builds React nodes only (no innerHTML), and plain text passes through as paragraphs, so it is
// safe for either source. It renders text the core/agent already produced — it computes nothing.
function mdInline(text, kp) {
  return String(text).split(/\*\*(.+?)\*\*/g)
    .map((p, i) => (i % 2 === 1 ? <strong key={kp + "-" + i}>{p}</strong> : p));
}
function Markdown({ text }) {
  if (!text) return null;
  const blocks = [];
  let para = [], list = [];
  const flushPara = () => { if (para.length) { blocks.push({ t: "p", lines: para }); para = []; } };
  const flushList = () => { if (list.length) { blocks.push({ t: "ul", lines: list }); list = []; } };
  for (const raw of String(text).replace(/\r/g, "").split("\n")) {
    const line = raw.trimEnd();
    if (!line.trim()) { flushPara(); flushList(); continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    const b = line.match(/^[-*]\s+(.*)$/);
    if (h) { flushPara(); flushList(); blocks.push({ t: "h", text: h[2] }); }
    else if (b) { flushPara(); list.push(b[1]); }
    else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return (
    <div className="agent-md">
      {blocks.map((blk, i) => {
        if (blk.t === "h") return <div key={i} className="agent-md-h">{mdInline(blk.text, "h" + i)}</div>;
        if (blk.t === "ul") return <ul key={i} className="agent-md-ul">{blk.lines.map((li, j) => <li key={j}>{mdInline(li, "li" + i + "-" + j)}</li>)}</ul>;
        return <p key={i}>{mdInline(blk.lines.join(" "), "p" + i)}</p>;
      })}
    </div>
  );
}

// Three-tier disclosure per agent: (a) a glance-readable verdict line, (b) an optional compact
// delta table, (c) the agent's own prose — shown only when it is LLM-authored (or as a fallback
// when the table couldn't be built), so a deterministic template never re-introduces a prose
// wall, (d) the full raw tool-call log collapsed behind a toggle. The toggle (show/hide of
// already-present content) is the ONLY interactivity in this section.
function AgentBlock({ title, sub, block, verdict, table, prose }) {
  const [open, setOpen] = useState(false);
  const calls = block && block.calls ? block.calls : [];
  return (
    <div className="memo-sec">
      <h4>{title}
        {block && <span className="mono" style={{ fontWeight: 400, fontSize: 11, color: "var(--faint)", marginLeft: 8 }}>
          · {sub} · {block.source}</span>}
      </h4>
      {!block
        ? <div className="memo-prose"><p style={{ color: "var(--faint)" }}>Not run for this case.</p></div>
        : (<React.Fragment>
            {verdict && <p className="agent-verdict">{verdict}</p>}
            {table}
            {prose && <div className="memo-prose"><Markdown text={prose} /></div>}
            {calls.length > 0 && (
              <div className="agent-trace-toggle">
                <button type="button" className="trace-toggle-btn"
                  aria-expanded={open} onClick={() => setOpen((o) => !o)}>
                  {open ? "▾ Hide full trace" : "▸ Show full trace"}
                  <span className="ttb-count">{calls.length} tool call{calls.length === 1 ? "" : "s"}</span>
                </button>
                {open && <AgentCallList calls={calls} />}
              </div>
            )}
          </React.Fragment>)}
    </div>
  );
}

function AgentTraceSection() {
  const at = M.agentTrace;
  // Each block shows a derived verdict + (sensitivity) delta table when the structured grammar
  // parses, and the agent's own prose only when it is LLM-authored — or as a fallback when the
  // structure didn't parse, so no information is ever lost. A deterministic template note is
  // therefore never shown as a prose wall (the table already says it, more legibly).
  const intake = at && at.intake;
  const prov = intake ? readIntakeProvenance(intake.reasoning) : null;
  // Require a non-zero total: a zero parse means the grounding sentence didn't really describe
  // sourced fields, so derive no verdict and let the prose stand instead of claiming "All 0".
  const validProv = prov && prov.total > 0;
  const intakeVerdict = validProv
    ? `All ${prov.total} subject fields are sourced, none invented — ${prov.openCalgary} from Open Calgary, ${prov.listing} from the listing, ${prov.estimated} estimated (${prov.estNames}).`
    : null;
  const intakeProse = intake && (intake.source === "llm" || !validProv) ? intake.reasoning : null;

  const sensitivity = at && at.sensitivity;
  const sensRows = sensitivity ? readSensitivityRows(sensitivity) : null;
  const sensVerdict = sensRows ? sensitivityVerdict(sensRows) : null;
  const sensProse = sensitivity && (sensitivity.source === "llm" || !sensRows) ? sensitivity.note : null;

  return (
    <section className="section" data-screen-label="Agent Trace">
      <SectionTitle
        index="07"
        name="Agent Trace"
        sub="Read-only audit of the two LLM agents that bracket the deterministic pipeline — intake grounding before, sensitivity probing after. Every number is computed by the core; the agents only choose read-only / core-routed tools and write prose."
        meta={<React.Fragment><Badge tone="ghost">read-only</Badge><Badge tone="ghost">agents bracket the core</Badge></React.Fragment>}
      />
      <div className="memo-doc">
        {!at
          ? <div className="memo-sec"><div className="memo-prose"><p>No agent trace in this snapshot.</p></div></div>
          : (<React.Fragment>
              <AgentBlock title="Intake reasoning" sub="before the pipeline · listing text → grounded Subject"
                block={intake} verdict={intakeVerdict} prose={intakeProse} />
              <AgentBlock title="Sensitivity analysis" sub="after the pipeline · stress-tests the finished value range"
                block={sensitivity} verdict={sensVerdict} prose={sensProse}
                table={<SensitivityDeltaTable rows={sensRows} />} />
            </React.Fragment>)}
      </div>
    </section>
  );
}
window.AgentTraceSection = AgentTraceSection;

// Nav tags are DERIVED from the data, not hardcoded literals, so they track any subject:
//   comps      = selected / retrieved   grid = comps × grid-lines
//   confidence = count of FIRED flags (must match the top bar and the "N raised" header)
// Rebuilt each render so the nav badges (derived from the data) track the active case.
function buildSections() {

  { id: "subject",   num: "01", name: "Subject",            Comp: () => window.SubjectSection(),       tag: { t: "REAL", c: "good" } },
  { id: "comps",     num: "02", name: "Comp Selection",     Comp: () => window.CompSelectionSection(), tag: { t: `${M.searchSummary.selected} / ${M.searchSummary.retrieved}`, c: "" } },
  { id: "grid",      num: "03", name: "Adjustment Grid",    Comp: () => window.AdjustmentGridSection(),tag: { t: `${M.selected.length}×${M.selected[0]?.lines.length || 0}`, c: "accent" } },
  { id: "recon",     num: "04", name: "Reconciliation",     Comp: () => window.ReconciliationSection(),tag: { t: "range", c: "" } },
  { id: "confidence",num: "05", name: "Confidence + Flags", Comp: () => window.ConfidenceSection(),    tag: { t: `${M.flags.filter((f) => f.status === "FIRED").length}`, c: "warn" } },
  { id: "memo",      num: "06", name: "Memo",               Comp: () => window.MemoSection(),          tag: null },
  { id: "agents",    num: "07", name: "Agent Trace",        Comp: () => window.AgentTraceSection(),     tag: { t: "read-only", c: "" } },
  ];
}

function App() {
  // Active case. Changing it reassigns the module-level `M` (read by every component via
  // closure) BEFORE the re-render, so the whole tree renders the newly-selected snapshot.
  const [caseKey, setCaseKey] = useState("east");
  const selectCase = (key) => {
    const hit = CASES.find((c) => c.key === key);
    if (!hit) return;
    M = hit.memo;
    setCaseKey(key);
  };

  const SECTIONS = buildSections();
  const [active, setActive] = useState(() => {
    const h = (location.hash || "").replace("#", "");
    if (SECTIONS.some((s) => s.id === h)) return h;
    return localStorage.getItem("memo.active") || "subject";
  });

  useEffect(() => {
    localStorage.setItem("memo.active", active);
    if (location.hash.replace("#", "") !== active) history.replaceState(null, "", "#" + active);
    const sc = document.querySelector(".scroll");
    if (sc) sc.scrollTop = 0;
  }, [active]);

  const cur = SECTIONS.find((s) => s.id === active) || SECTIONS[0];
  const r = M.range, cf = M.confidence;
  const firedCount = M.flags.filter((f) => f.status === "FIRED").length;
  const idx = SECTIONS.findIndex((s) => s.id === active);

  return (
    <div id="app">
      <aside className="rail">
        <div className="rail-brand">
          <div className="brand-mark"><span className="brand-dot" />Gridstone</div>
          <div className="brand-title">Comp Memo · Audit View</div>
          <div className="brand-sub">{M.meta.caseId}</div>
          {CASES.length > 1 && (
            <label className="case-switch">
              <span className="case-switch-k">demo case</span>
              <select value={caseKey} onChange={(e) => selectCase(e.target.value)}>
                {CASES.map((c) => (
                  <option key={c.key} value={c.key}>{c.name}</option>
                ))}
              </select>
            </label>
          )}
        </div>

        <div className="rail-subject">
          <div className="rs-row">
            <span className="rs-addr">{M.subject.addr}</span>
          </div>
          <div className="rs-meta">
            <span>{M.subject.community} · {M.subject.district} · detached · {M.subject.gla.toLocaleString()} sf</span>
          </div>
        </div>

        <nav className="rail-nav">
          <div className="nav-group-label">pipeline stages</div>
          {SECTIONS.map((s) => (
            <button
              key={s.id}
              className={"nav-item" + (s.id === active ? " active" : "")}
              onClick={() => setActive(s.id)}
            >
              <span className="ni-num">{s.num}</span>
              <span className="ni-name">{s.name}</span>
              {s.tag
                ? <span className={"ni-tag " + (s.tag.c || "")}>{s.tag.t}</span>
                : <span />}
            </button>
          ))}
        </nav>

        <div className="rail-foot">
          <div><span className="rf-k">snapshot</span> 2026-06-01</div>
          <div><span className="rf-k">source</span> open_calgary_assessment</div>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <div className="crumb">
            <b>Gridstone</b> / Comp Memo / <b>{cur.num} · {cur.name}</b>
          </div>
          <div className="status-strip">
            <div className="chip"><span className="chip-k">Value range</span><span className="chip-v accent">{M.usd0(r.low)} – {M.usd0(r.high)}</span></div>
            <div className="chip"><span className="chip-k">Weighted point</span><span className="chip-v">{M.usd0(r.point)}</span></div>
            <div className="chip"><span className="chip-k">Confidence</span><span className="chip-v warn">{cf.band} · {cf.score.toFixed(2)}</span></div>
            <div className="chip"><span className="chip-k">Review flags</span><span className="chip-v warn">{firedCount} fired</span></div>
          </div>
        </div>

        <div className="scroll">
          {cur.Comp()}
          <div className="section" style={{ paddingTop: 0, paddingBottom: 40 }}>
            <div style={{ display: "flex", justifyContent: "space-between", gap: 12, borderTop: "1px solid var(--line)", paddingTop: 18 }}>
              <button className="nav-item" style={{ width: "auto", maxWidth: 260, opacity: idx === 0 ? 0.4 : 1, pointerEvents: idx === 0 ? "none" : "auto" }}
                onClick={() => idx > 0 && setActive(SECTIONS[idx - 1].id)}>
                <span className="ni-num">←</span><span className="ni-name">{idx > 0 ? SECTIONS[idx - 1].name : "—"}</span><span />
              </button>
              <button className="nav-item" style={{ width: "auto", maxWidth: 260, opacity: idx === SECTIONS.length - 1 ? 0.4 : 1, pointerEvents: idx === SECTIONS.length - 1 ? "none" : "auto" }}
                onClick={() => idx < SECTIONS.length - 1 && setActive(SECTIONS[idx + 1].id)}>
                <span className="ni-num">→</span><span className="ni-name">{idx < SECTIONS.length - 1 ? SECTIONS[idx + 1].name : "—"}</span><span />
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);


</script>
</body>
</html>
